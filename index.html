<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      border: 3px solid #2ecc40;
      box-shadow: 0 0 30px rgba(46, 204, 64, 0.4);
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="640"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // ── Game states ──────────────────────────────────────────────
  const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
  let gameState = STATE.START;

  // ── Bird ─────────────────────────────────────────────────────
  const bird = {
    x: 80,
    y: canvas.height / 2,
    radius: 18,
    velocity: 0,
    gravity: 0.5,
    jumpStrength: -9,

    reset() {
      this.y = canvas.height / 2;
      this.velocity = 0;
    },

    jump() {
      this.velocity = this.jumpStrength;
    },

    update() {
      this.velocity += this.gravity;
      this.y += this.velocity;
    },

    draw() {
      ctx.save();
      const angle = Math.min(Math.max(this.velocity * 0.05, -0.5), 1.2);
      ctx.translate(this.x, this.y);
      ctx.rotate(angle);

      // Body
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#FFD700';
      ctx.fill();
      ctx.strokeStyle = '#FFA500';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.beginPath();
      ctx.ellipse(-4, 5, 10, 6, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFA500';
      ctx.fill();

      // Eye white
      ctx.beginPath();
      ctx.arc(8, -5, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      // Pupil
      ctx.beginPath();
      ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#222';
      ctx.fill();

      // Beak
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(23, -3);
      ctx.lineTo(23, 3);
      ctx.closePath();
      ctx.fillStyle = '#FF6600';
      ctx.fill();

      ctx.restore();
    },

    // Slightly smaller hitbox than visual for fairer gameplay
    getHitbox() {
      const r = this.radius - 5;
      return { x: this.x - r, y: this.y - r, w: r * 2, h: r * 2 };
    }
  };

  // ── Pipes ────────────────────────────────────────────────────
  const PIPE_WIDTH = 62;
  const PIPE_GAP   = 168;
  const PIPE_SPEED = 3;
  let pipes = [];
  let frameCount = 0;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('flappyHighScore')) || 0;

  function spawnPipe() {
    const minY = 90;
    const maxY  = canvas.height - 90 - PIPE_GAP;
    const gapY  = Math.floor(Math.random() * (maxY - minY)) + minY;
    pipes.push({ x: canvas.width + 10, gapY, scored: false });
  }

  function updatePipes() {
    if (frameCount % 90 === 0) spawnPipe();

    for (let i = pipes.length - 1; i >= 0; i--) {
      pipes[i].x -= PIPE_SPEED;

      if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
        pipes[i].scored = true;
        score++;
      }
      if (pipes[i].x + PIPE_WIDTH < 0) pipes.splice(i, 1);
    }
  }

  function drawPipeSegment(x, y, w, h, isTop) {
    const capH = 28, capOffset = 5;
    const capX = x - capOffset, capW = w + capOffset * 2;

    // Body gradient
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0,   '#3adb42');
    g.addColorStop(0.35,'#27ae60');
    g.addColorStop(1,   '#145a32');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    // Cap gradient
    const gc = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    gc.addColorStop(0,   '#3adb42');
    gc.addColorStop(0.35,'#27ae60');
    gc.addColorStop(1,   '#145a32');
    ctx.fillStyle = gc;
    if (isTop) ctx.fillRect(capX, y + h - capH, capW, capH);
    else       ctx.fillRect(capX, y,            capW, capH);

    // Highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x + 6, y, 10, h);
  }

  function drawPipes() {
    pipes.forEach(p => {
      drawPipeSegment(p.x, 0,              PIPE_WIDTH, p.gapY,                        true);
      drawPipeSegment(p.x, p.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height - p.gapY - PIPE_GAP, false);
    });
  }

  // ── Collision ────────────────────────────────────────────────
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function checkCollision() {
    const hb = bird.getHitbox();

    if (bird.y + bird.radius > canvas.height - 30) return true; // ground
    if (bird.y - bird.radius < 0)                  return true; // ceiling

    for (const p of pipes) {
      const capOff = 5;
      const topRect = { x: p.x - capOff, y: 0,               w: PIPE_WIDTH + capOff * 2, h: p.gapY };
      const botRect = { x: p.x - capOff, y: p.gapY + PIPE_GAP, w: PIPE_WIDTH + capOff * 2, h: canvas.height };
      if (rectsOverlap(hb, topRect) || rectsOverlap(hb, botRect)) return true;
    }
    return false;
  }

  // ── Background ───────────────────────────────────────────────
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height - 30);
    sky.addColorStop(0,   '#5bc8f5');
    sky.addColorStop(1,   '#d0f0fc');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height - 30);

    drawCloud(55,  80,  0.9);
    drawCloud(270, 50,  1.1);
    drawCloud(400, 105, 0.75);

    // Ground
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    ctx.fillStyle = '#558B2F';
    ctx.fillRect(0, canvas.height - 18, canvas.width, 18);
  }

  function drawCloud(x, y, s) {
    ctx.save();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(x,            y,           26 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s,   y - 10 * s,  20 * s, 0, Math.PI * 2);
    ctx.arc(x + 44 * s,   y,           26 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── Score display ────────────────────────────────────────────
  function drawScore() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 4;
    ctx.strokeText(score, canvas.width / 2, 68);
    ctx.fillStyle = 'white';
    ctx.fillText(score, canvas.width / 2, 68);
  }

  // ── Rounded rect helper ──────────────────────────────────────
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y,         x + r, y);
    ctx.closePath();
  }

  // ── Start screen ─────────────────────────────────────────────
  function drawStartScreen() {
    drawBackground();
    bird.draw();

    // Panel
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(55, 155, canvas.width - 110, 215, 22);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = 'bold 54px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 5;
    ctx.strokeText('FLAPPY BIRD', canvas.width / 2, 232);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('FLAPPY BIRD', canvas.width / 2, 232);

    ctx.font = '21px Arial';
    ctx.fillStyle = 'white';
    ctx.fillText('Trykk MELLOMROM for å starte', canvas.width / 2, 288);
    ctx.fillText('eller klikk på spillfeltet', canvas.width / 2, 316);

    if (highScore > 0) {
      ctx.font = 'bold 20px Arial';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('Rekord: ' + highScore, canvas.width / 2, 358);
    }
  }

  // ── Game Over screen ─────────────────────────────────────────
  function drawGameOverScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.52)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Panel
    ctx.fillStyle = 'rgba(15,15,35,0.94)';
    roundRect(55, 185, canvas.width - 110, 272, 22);
    ctx.fill();
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 3;
    roundRect(55, 185, canvas.width - 110, 272, 22);
    ctx.stroke();

    ctx.textAlign = 'center';

    // Title
    ctx.font = 'bold 52px Arial';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 5;
    ctx.strokeText('GAME OVER', canvas.width / 2, 256);
    ctx.fillStyle = '#e74c3c';
    ctx.fillText('GAME OVER', canvas.width / 2, 256);

    // Divider
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(90, 272); ctx.lineTo(canvas.width - 90, 272);
    ctx.stroke();

    // Scores
    ctx.font = 'bold 30px Arial';
    ctx.fillStyle = 'white';
    ctx.fillText('Poeng: ' + score, canvas.width / 2, 316);

    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('Rekord: ' + highScore, canvas.width / 2, 355);

    // New record banner
    if (score > 0 && score === highScore) {
      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = '#2ecc71';
      ctx.fillText('★ Ny rekord! ★', canvas.width / 2, 388);
    }

    // Restart hint
    ctx.font = '18px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Trykk MELLOMROM for å prøve igjen', canvas.width / 2, 430);
  }

  // ── Input ────────────────────────────────────────────────────
  function handleInput() {
    if (gameState === STATE.START || gameState === STATE.GAMEOVER) {
      resetGame();
    } else if (gameState === STATE.PLAYING) {
      bird.jump();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); handleInput(); }
  });
  canvas.addEventListener('click', handleInput);

  // ── Reset ────────────────────────────────────────────────────
  function resetGame() {
    bird.reset();
    pipes      = [];
    frameCount = 0;
    score      = 0;
    gameState  = STATE.PLAYING;
  }

  // ── Main loop ────────────────────────────────────────────────
  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === STATE.START) {
      drawStartScreen();

    } else if (gameState === STATE.PLAYING) {
      frameCount++;
      bird.update();
      updatePipes();

      drawBackground();
      drawPipes();
      bird.draw();
      drawScore();

      if (checkCollision()) {
        if (score >= highScore) {
          highScore = score;
          localStorage.setItem('flappyHighScore', highScore);
        }
        gameState = STATE.GAMEOVER;
      }

    } else if (gameState === STATE.GAMEOVER) {
      drawBackground();
      drawPipes();
      bird.draw();
      drawGameOverScreen();
    }

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
